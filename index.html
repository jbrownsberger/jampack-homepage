<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jampack Studios</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #eef2f7;
      --glass-bg: rgba(255,255,255,0.55);
      --glass-border: rgba(255,255,255,0.75);
      --accent:   #3b6fd4;
      --accent2:  #7c5cbf;
      --text:     #1a1e2e;
      --muted:    #6b7280;
      --radius:   16px;
      --gap:      1.5rem;
      --shadow:   0 8px 32px rgba(30,40,80,0.10);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Hero ───────────────────────────────────────────── */
    .hero {
      position: relative;
      height: 52vh;
      min-height: 320px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }

    .hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 55%;
      filter: brightness(0.88) saturate(1.1);
    }

    .hero-glass {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 2rem 2.5rem 2.25rem;
      background: rgba(255,255,255,0.38);
      backdrop-filter: blur(14px) saturate(1.6);
      -webkit-backdrop-filter: blur(14px) saturate(1.6);
      border-top: 1px solid rgba(255,255,255,0.6);
    }

    .hero-glass h1 {
      font-size: clamp(1.9rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(130deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-glass p {
      margin-top: 0.4rem;
      font-size: 1rem;
      color: #374060;
      max-width: 520px;
    }

    /* ── App Grid ────────────────────────────────────────── */
    main {
      flex: 1;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 3rem var(--gap) 4rem;
    }

    .section-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: var(--gap);
    }

    /* ── Glass Card ──────────────────────────────────────── */
    .card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 1.75rem 1.75rem 1.5rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px) saturate(1.4);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 48px rgba(59,111,212,0.16);
      border-color: rgba(100,150,255,0.6);
    }

    .card-icon { font-size: 2rem; line-height: 1; }

    .card h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
    }

    .card p {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.65;
      flex: 1;
    }

    .card-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 0.22rem 0.65rem;
      border-radius: 999px;
      background: rgba(59,111,212,0.08);
      border: 1px solid rgba(59,111,212,0.2);
      color: var(--accent);
      width: fit-content;
      margin-top: 0.25rem;
    }

    /* ── Footer ─────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 1.4rem;
      color: var(--muted);
      font-size: 0.8rem;
      border-top: 1px solid rgba(0,0,0,0.07);
    }
  </style>
</head>
<body>

  <div class="hero">
    <img class="hero-img" src="images/hero.jpg" alt="Green hillside with hay bales and a Jersey cow at a fence" />
    <div class="hero-glass">
      <h1>Jampack Studios</h1>
      <p>Web applications built for productivity, planning, and everyday life.</p>
    </div>
  </div>

  <main>
    <p class="section-label">Applications</p>
    <div class="grid" id="app-grid"></div>
  </main>

  <footer>
    &copy; <span id="year"></span> Jampack Studios
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const apps = [
      {
        icon: "🏡",
        name: "GreenHouse",
        description: "Household budget and finance tracker with bank integration, spending insights, and fuel cost forecasting.",
        tag: "Finance",
        url: "https://greenhouse.jampackstudios.com"
      },
      {
        icon: "✅",
        name: "Commitments",
        description: "A deadline and commitment tracker to keep your obligations visible and your priorities clear.",
        tag: "Productivity",
        url: "https://pelorus.jampackstudios.com"
      },
      {
        icon: "⛽",
        name: "Fuel Forecast",
        description: "Real-time regional fuel price tracking with threshold alerts and price-trend forecasting.",
        tag: "Utilities",
        url: "https://fuel-forecast.onrender.com"
      },
    ];

    const grid = document.getElementById('app-grid');
    apps.forEach(app => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = app.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.innerHTML = `
        <div class="card-icon">${app.icon}</div>
        <h2>${app.name}</h2>
        <p>${app.description}</p>
        <span class="card-tag">${app.tag}</span>
      `;
      grid.appendChild(card);
    });
  </script>

</body>
</html>
