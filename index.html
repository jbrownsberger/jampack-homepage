<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jampack Studios</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #eef2f7;
      --glass-bg:     rgba(255,255,255,0.45);
      --glass-border: rgba(255,255,255,0.70);
      --accent:       #3b6fd4;
      --accent2:      #7c5cbf;
      --text:         #1a1e2e;
      --muted:        #6b7280;
      --radius:       14px;
      --gap:          1.25rem;
      --shadow:       0 6px 24px rgba(30,40,80,0.09);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Full-bleed hero — photo fills the viewport ── */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 500px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 42% 82%;
      filter: brightness(0.90) saturate(1.1);
    }

    /* ── Glass title pill — top-left, compact ── */
    .hero-title {
      position: relative;
      z-index: 2;
      align-self: flex-start;
      margin: 2rem 2rem 0;
      padding: 0.75rem 1.4rem;
      background: rgba(255,255,255,0.35);
      backdrop-filter: blur(16px) saturate(1.8);
      -webkit-backdrop-filter: blur(16px) saturate(1.8);
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 999px;
    }

    .hero-title h1 {
      font-size: clamp(1.1rem, 2.5vw, 1.6rem);
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(130deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }

    /* ── Glass card row — sits at the bottom of the hero ── */
    .hero-cards {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 0 2rem 2rem;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.7);
      margin-bottom: 0.75rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: var(--gap);
    }

    /* ── Glass Card ── */
    .card {
      background: rgba(255,255,255,0.30);
      border: 1px solid rgba(255,255,255,0.60);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem 1rem;
      backdrop-filter: blur(14px) saturate(1.5);
      -webkit-backdrop-filter: blur(14px) saturate(1.5);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      background: rgba(255,255,255,0.48);
      box-shadow: 0 12px 36px rgba(59,111,212,0.18);
    }

    .card-letter {
      font-size: 1rem;
      font-weight: 800;
      color: var(--accent);
      opacity: 0.6;
      letter-spacing: -0.01em;
      line-height: 1;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #1a1e2e;
    }

    .card p {
      font-size: 0.8rem;
      color: #3a3f55;
      line-height: 1.55;
    }

    .card-tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      background: rgba(59,111,212,0.10);
      border: 1px solid rgba(59,111,212,0.22);
      color: var(--accent);
      width: fit-content;
      margin-top: 0.2rem;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.1rem;
      color: var(--muted);
      font-size: 0.78rem;
      border-top: 1px solid rgba(0,0,0,0.07);
      background: var(--bg);
    }
  </style>
</head>
<body>

  <div class="hero">
    <img class="hero-img" src="images/hero.jpg" alt="Green hillside with hay bales and a Jersey cow at a fence" />

    <div class="hero-title">
      <h1>Jampack Studios</h1>
    </div>

    <div class="hero-cards">
      <p class="section-label">Applications</p>
      <div class="grid" id="app-grid"></div>
    </div>
  </div>

  <footer>
    &copy; <span id="year"></span> Jampack Studios
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const apps = [
      {
        name: "GreenHouse",
        description: "Household budget and finance tracker with bank integration, spending insights, and fuel cost forecasting.",
        tag: "Finance",
        url: "https://greenhouse.jampackstudios.com"
      },
      {
        name: "Commitments",
        description: "A deadline and commitment tracker to keep your obligations visible and your priorities clear.",
        tag: "Productivity",
        url: "https://pelorus.jampackstudios.com"
      },
      {
        name: "Fuel Forecast",
        description: "Real-time regional fuel price tracking with threshold alerts and price-trend forecasting.",
        tag: "Utilities",
        url: "https://fuel-forecast.onrender.com"
      },
    ];

    const grid = document.getElementById('app-grid');
    apps.forEach(app => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = app.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.innerHTML = `
        <div class="card-letter">${app.name.charAt(0)}</div>
        <h2>${app.name}</h2>
        <p>${app.description}</p>
        <span class="card-tag">${app.tag}</span>
      `;
      grid.appendChild(card);
    });
  </script>

</body>
</html>
