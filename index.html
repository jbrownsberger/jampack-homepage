<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jampack Studios</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --header-bg:    #2c3e2d;
      --header-text:  #e8ede8;
      --accent:       #5b8a5f;
      --accent2:      #4a7a7e;
      --text:         #1a1e2e;
      --muted:        #6b7280;
      --radius:       14px;
      --gap:          1.25rem;
      --shadow:       0 6px 24px rgba(20,30,20,0.13);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--header-bg);
      padding: 0.85rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      z-index: 10;
      position: relative;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--header-text);
      text-transform: uppercase;
    }

    /* ── Full-bleed hero ── */
    .hero {
      position: relative;
      flex: 1;
      min-height: 0;
      height: calc(100vh - 48px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 42% 82%;
      filter: brightness(0.90) saturate(1.1);
    }

    /* ── Card row at bottom of hero ── */
    .hero-cards {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 0 2rem 2rem;
    }

    .section-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.65);
      margin-bottom: 0.7rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: var(--gap);
    }

    /* ── Glass Card ── */
    .card {
      background: rgba(255,255,255,0.28);
      border: 1px solid rgba(255,255,255,0.58);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem 1rem;
      backdrop-filter: blur(14px) saturate(1.5);
      -webkit-backdrop-filter: blur(14px) saturate(1.5);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      background: rgba(255,255,255,0.46);
      box-shadow: 0 12px 36px rgba(44,62,45,0.22);
    }

    .card-letter {
      font-size: 1rem;
      font-weight: 800;
      color: var(--accent);
      opacity: 0.75;
      letter-spacing: -0.01em;
      line-height: 1;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #1a1e2e;
    }

    .card p {
      font-size: 0.8rem;
      color: #3a3f55;
      line-height: 1.55;
    }

    .card-tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      background: rgba(91,138,95,0.12);
      border: 1px solid rgba(91,138,95,0.30);
      color: var(--accent);
      width: fit-content;
      margin-top: 0.2rem;
    }

    /* ── Footer ── */
    footer {
      background: var(--header-bg);
      text-align: center;
      padding: 0.85rem;
      color: rgba(232,237,232,0.5);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Jampack Studios</h1>
  </header>

  <div class="hero">
    <img class="hero-img" src="images/hero.jpg" alt="Green hillside with hay bales and a Jersey cow at a fence" />

    <div class="hero-cards">
      <p class="section-label">Applications</p>
      <div class="grid" id="app-grid"></div>
    </div>
  </div>

  <footer>
    &copy; <span id="year"></span> Jampack Studios
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const apps = [
      {
        name: "GreenHouse",
        description: "Household budget and finance tracker with bank integration, spending insights, and fuel cost forecasting.",
        tag: "Finance",
        url: "https://greenhouse.jampackstudios.com"
      },
      {
        name: "Commitments",
        description: "A deadline and commitment tracker to keep your obligations visible and your priorities clear.",
        tag: "Productivity",
        url: "https://pelorus.jampackstudios.com"
      },
      {
        name: "Fuel Forecast",
        description: "Real-time regional fuel price tracking with threshold alerts and price-trend forecasting.",
        tag: "Utilities",
        url: "https://fuel-forecast.onrender.com"
      },
    ];

    const grid = document.getElementById('app-grid');
    apps.forEach(app => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = app.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.innerHTML = `
        <div class="card-letter">${app.name.charAt(0)}</div>
        <h2>${app.name}</h2>
        <p>${app.description}</p>
        <span class="card-tag">${app.tag}</span>
      `;
      grid.appendChild(card);
    });
  </script>

</body>
</html>
